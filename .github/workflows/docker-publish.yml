name: Build and Publish Docker Image

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/odysseia-guidance

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      started_at: ${{ steps.timing.outputs.started_at }}

    steps:
      - name: Record workflow start time
        id: timing
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate Docker Hub secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "Please configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in GitHub repository secrets."
            exit 1
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare platform environment
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  notify:
    runs-on: ubuntu-latest
    needs: [prepare, build, merge]
    if: ${{ always() }}

    steps:
      - name: Notify Discord webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title || github.sha }}
          STARTED_AT: ${{ needs.prepare.outputs.started_at }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          webhook_url = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          if not webhook_url:
              raise SystemExit(0)

          prepare_res = os.environ.get("PREPARE_RESULT", "").strip().lower()
          build_res = os.environ.get("BUILD_RESULT", "").strip().lower()
          merge_res = os.environ.get("MERGE_RESULT", "").strip().lower()
          success = (prepare_res == "success" and build_res == "success" and merge_res == "success")
          result_text = "成功" if success else "失败"
          color = 0x57F287 if success else 0xED4245
          started_at = int(os.environ.get("STARTED_AT", "0") or "0")
          elapsed_seconds = max(int(time.time()) - started_at, 0) if started_at else 0
          minutes, seconds = divmod(elapsed_seconds, 60)
          duration_text = f"{minutes}分{seconds}秒" if minutes else f"{seconds}秒"
          commit_message = os.environ.get("COMMIT_MESSAGE", "").strip().splitlines()[0]

          payload = {
              "embeds": [
                  {
                      "title": "Docker 构建通知",
                      "color": color,
                      "fields": [
                          {
                              "name": "运行结果",
                              "value": result_text,
                              "inline": False,
                          },
                          {
                              "name": "构建架构",
                              "value": "linux/amd64, linux/arm64 (并行构建)",
                              "inline": False,
                          },
                          {
                              "name": "耗时",
                              "value": duration_text,
                              "inline": False,
                          },
                          {
                              "name": "提交名称",
                              "value": commit_message or "(空)",
                              "inline": False,
                          },
                      ],
                  }
              ]
          }

          request = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "GitHubActions-DiscordWebhook/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request) as response:
                  if response.status >= 400:
                      raise RuntimeError(f"Discord webhook failed with status {response.status}")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(f"Discord webhook failed with status {exc.code}: {body}") from exc
          PY
